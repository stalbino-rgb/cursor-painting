<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인 | 칼러 조색 가이드</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #f9f9f9;
        color: #1f2937;
      }
      .card {
        width: min(92vw, 420px);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      }
      .title {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .text {
        margin: 0;
        line-height: 1.5;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">오프라인 상태입니다</h1>
      <p class="text">네트워크에 다시 연결되면 최신 색상 데이터와 기능을 자동으로 불러옵니다.</p>
    </div>
  </body>
</html>
